name: 'Backblaze B2 Cloud Storage Action'
description: 'Upload, download, sync, copy, and manage Backblaze B2 Cloud Storage from GitHub Actions workflows.'
author: 'Backblaze, Inc.'
branding:
  icon: 'archive'
  color: 'red'

inputs:
  action:
    description: 'One of: upload | download | sync | copy | delete | presign | list | hide | unhide | verify | retention | head | purge | create-key | list-keys | delete-key'
    required: true
  application-key-id:
    description: 'B2 application key ID. If unset, falls back to the $B2_APPLICATION_KEY_ID env var.'
    required: false
  application-key:
    description: 'B2 application key. If unset, falls back to the $B2_APPLICATION_KEY env var.'
    required: false
  bucket:
    description: 'Target bucket name (the destination bucket for copy). Required for bucket-scoped file operations; not required for application-key management actions.'
    required: false
  source-bucket:
    description: 'Source bucket for cross-bucket copy. Defaults to `bucket`.'
    required: false
  source:
    description: 'Command-dependent. upload/sync (up): local path or glob. download/sync (down)/copy/delete/presign/list/hide/unhide/verify/retention/head/purge: B2 file name or prefix. Prefix downloads reject keys with empty, `.`, `..`, or control-character path segments. For whole-bucket purge, omit source or set `/` and set allow-bucket-purge: true.'
    required: false
  destination:
    description: 'Command-dependent. upload/sync (up): B2 file name or prefix; SDK/B2 key validation errors are surfaced rather than silently rewriting `/` characters. download/sync (down): local path or directory. copy: destination B2 file name. verify: local file to compare against the remote SHA-1.'
    required: false
  include:
    description: 'Comma-separated globs to include (upload). Patterns are anchored to source.'
    required: false
  exclude:
    description: 'Comma-separated globs to exclude (upload). Defaults exclude .git/**.'
    required: false
    default: '.git/**'
  concurrency:
    description: 'Parallel parts for a large upload, or parallel files for a glob/sync. Must be a positive decimal integer. Default 4.'
    required: false
    default: '4'
  part-size:
    description: 'Multipart part size in bytes. Must be a positive decimal integer. Defaults to the SDK-recommended size.'
    required: false
  resume:
    description: 'Reserved. Accepted for forward compatibility but currently not honored: the action uploads through a streaming source that the SDK cannot slice for resume. Set, but expect a full re-upload on retry.'
    required: false
    default: 'true'
  content-type:
    description: 'Content-Type for uploads. Defaults to "b2/x-auto" (B2 auto-detects).'
    required: false
  file-info:
    description: "Custom upload fileInfo metadata as newline- or simple comma-separated key=value pairs. Use newline-separated entries when values contain commas. Keys are normalized to lowercase, may contain letters, digits, and B2-supported special characters (-_.`~!#$%^&*'|+), cannot start with b2-, and must fit B2 fileInfo limits. Use cache-control/content-disposition/content-language/expires for reserved b2-* response headers."
    required: false
  cache-control:
    description: 'Cache-Control response header to store with uploaded files.'
    required: false
  content-disposition:
    description: 'Content-Disposition response header to store with uploaded files.'
    required: false
  content-language:
    description: 'Content-Language response header to store with uploaded files.'
    required: false
  expires:
    description: 'Expires response header to store with uploaded files.'
    required: false
  preserve-mtime:
    description: 'Store each uploaded file''s local modification time as B2 src_last_modified_millis. Default false.'
    required: false
    default: 'false'
  dry-run:
    description: 'Preview what would happen without executing (sync/delete/purge). Default false.'
    required: false
    default: 'false'
  allow-bucket-purge:
    description: 'Permit `purge` to target the entire bucket when `source` is empty or `/`. Default false; ignored by other actions.'
    required: false
    default: 'false'
  presign-ttl:
    description: 'Presigned URL TTL in seconds (presign action). Must be a positive decimal integer. Default 3600.'
    required: false
    default: '3600'
  endpoint:
    description: 'Override the B2 realm endpoint. Leave empty for production.'
    required: false
  fail-on-empty:
    description: 'Fail the action if an upload glob matches zero files (default true).'
    required: false
    default: 'true'
  sse:
    description: 'Server-side encryption: "B2" (SSE-B2) or "C:<base64-32-byte-key>" (SSE-C). SSE-C keys must use canonical base64 and decode to exactly 32 bytes.'
    required: false
  compare-mode:
    description: 'Sync comparison: modtime | size | none. Default modtime.'
    required: false
    default: 'modtime'
  keep-mode:
    description: 'Sync deletion policy for orphans: no-delete | delete | keep-days. Default no-delete.'
    required: false
    default: 'no-delete'
  direction:
    description: 'Sync direction: auto | up (local→B2) | down (B2→local). Default auto.'
    required: false
    default: 'auto'
  max-results:
    description: 'Maximum number of files returned by `list`, or application keys returned by `list-keys`. Must be a positive decimal integer. Default 1000.'
    required: false
    default: '1000'
  expected-sha1:
    description: 'Expected 40-character hexadecimal SHA-1 digest for `verify`; malformed values fail before comparison. If unset, the SHA-1 is computed from `destination` (a local file). Non-comparable remote SHA-1 headers such as `none` or `unverified:<sha1>` publish `verified=false` outputs before failing the step.'
    required: false
  retention-mode:
    description: 'Object Lock retention mode for `retention`: compliance | governance | none.'
    required: false
  retention-until:
    description: 'ISO 8601 timestamp until which the file is retained (required when retention-mode is compliance/governance).'
    required: false
  legal-hold:
    description: 'Legal hold status for `retention`: on | off.'
    required: false
  bypass-governance:
    description: 'Allow governance-mode retention bypass for retention changes and delete/purge operations (requires bypassGovernance capability).'
    required: false
    default: 'false'
  capabilities:
    description: 'Comma-separated B2 capabilities to grant for `create-key`, for example `listFiles,readFiles,writeFiles`. Key-management and account-administration capabilities require `allow-privileged-capabilities: true`.'
    required: false
  key-name:
    description: 'Human-readable application key name for `create-key`; for `delete-key`, validates the target unless `target-key-name-prefix` or `allow-unsafe-key-delete` is set.'
    required: false
  scope-bucket:
    description: 'Bucket name to scope a `create-key` application key to. Omit only with `allow-account-level-key: true`.'
    required: false
  name-prefix:
    description: 'Optional file-name prefix restriction for `create-key`. Requires `scope-bucket`.'
    required: false
  valid-duration:
    description: 'Validity duration in seconds for `create-key`. Omit only with `allow-non-expiring-key: true`.'
    required: false
  target-application-key-id:
    description: 'Application key ID to delete for `delete-key`.'
    required: false
  target-key-name-prefix:
    description: 'Application key name prefix allowed for `delete-key` target validation. Use this or `key-name` unless `allow-unsafe-key-delete: true` is set.'
    required: false
  allow-account-level-key:
    description: 'Permit `create-key` to mint an account-level key without `scope-bucket`. Review carefully before enabling.'
    required: false
    default: 'false'
  allow-non-expiring-key:
    description: 'Permit `create-key` to mint a key without `valid-duration`. Review carefully before enabling.'
    required: false
    default: 'false'
  allow-privileged-capabilities:
    description: 'Permit `create-key` to grant key-management or account-administration capabilities such as listKeys, writeKeys, deleteKeys, bucket administration, or bypassGovernance.'
    required: false
    default: 'false'
  allow-unsafe-key-delete:
    description: 'Permit `delete-key` without validating the target key name or prefix. Review carefully before enabling.'
    required: false
    default: 'false'

outputs:
  application-key-id:
    description: 'Application key ID returned by `create-key` or `delete-key`.'
  application-key:
    description: 'Application key secret returned once by `create-key`. The action masks this value before writing the output.'
  key-name:
    description: 'Application key name returned by `create-key` or `delete-key`.'
  keys-listed:
    description: 'Number of application keys returned by `list-keys`.'
  key-deleted:
    description: '`true` when `delete-key` deleted a key; `false` for dry-run or already-absent no-ops.'
  file-id:
    description: 'B2 file ID of a single-file op (upload, copy, hide, retention, head). For `unhide`, set only when a hide marker is removed and identifies that removed marker.'
  file-name:
    description: 'B2 file name (path) of a single-file op.'
  content-sha1:
    description: 'SHA-1 hex digest when B2 provides a whole-file digest; omitted when unavailable, including multipart objects.'
  bytes-transferred:
    description: 'Total bytes uploaded/downloaded/copied/synced. Head emits 0.'
  file-count:
    description: 'Aggregate count of files matched or processed by file/object commands, including skipped sync entries and dry-run delete/purge matches. Not emitted by key-management actions.'
  files-uploaded:
    description: 'Number of files uploaded (upload glob / sync up).'
  files-downloaded:
    description: 'Number of files downloaded (download prefix / sync down).'
  files-deleted:
    description: 'Number of files deleted (delete / purge / sync).'
  files-listed:
    description: 'Number of files returned by `list` or prefix `presign`.'
  presigned-url:
    description: 'Presigned download URL (presign action). This is the only structured output that carries the live presigned URL.'
  verified:
    description: 'true/false: whether `verify` succeeded.'
  remote-sha1:
    description: 'Normalized comparable remote SHA-1 from `verify`, raw non-comparable B2 value such as `none` or `unverified:<sha1>`, or empty when B2 does not expose one.'
  local-sha1:
    description: 'Local file SHA-1 computed by `verify`.'
  summary-json:
    description: 'Complete JSON array with per-file or per-key details when the manifest fits within 256 KiB of UTF-8 JSON text. When exceeded, emits [] instead of changing shape or emitting a partial array. Credential-like fields are omitted by name for every command. For upload entries, fileInfo is SDK-returned metadata when available, otherwise canonical submitted metadata. For presign, entries omit live presigned URLs. For key actions, entries omit application-key secrets, accountId, and deprecated bucketId.'
  summary-json-truncated:
    description: 'Always-emitted true/false branch key; true when the full manifest exceeded the supported summary-json size cap. When true, file-count and verb-specific count outputs remain the authoritative totals.'
  summary-json-notice:
    description: 'Small JSON truncation notice emitted only when summary-json-truncated is true, with truncated, reason, totalCount, previewCount, and previewOutput fields.'
  summary-json-preview:
    description: 'Bounded partial JSON array emitted only when summary-json-truncated is true. Do not treat it as a complete manifest. Credential-like fields are omitted by name for every command. For presign, entries omit live presigned URLs.'
  retryable:
    description: 'Failure-path signal for classified SDK errors: true only when the action is safe to re-run automatically.'
  retry-after:
    description: 'Failure-path retry delay in seconds, clamped to 3600 and emitted only with retryable=true.'

runs:
  using: 'node24'
  main: 'dist/index.js'
