name: Full lockfile audit heartbeat

on:
  schedule:
    # Daily, 05:41 UTC (off-the-hour to avoid the GH Actions cron stampede).
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions:
  contents: read # default read-only access; heartbeat job escalates below

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  heartbeat:
    name: verify recent full-lockfile audit
    if: github.repository == 'backblaze-labs/b2-action'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # inspect scheduled full-lockfile audit runs
      issues: write # open or update the heartbeat tracking issue
    steps:
      - name: Check latest scheduled audit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          title="Full-lockfile audit heartbeat missing"
          tracking_label="full-lockfile-audit-heartbeat"
          threshold_epoch="$(date -u -d '10 days ago' +%s)"
          latest_run="$(gh run list \
            --repo "$REPO" \
            --workflow full-lockfile-audit.yml \
            --branch main \
            --limit 20 \
            --json createdAt,event,status,conclusion,url \
            --jq 'map(select(.event == "schedule" or .event == "workflow_dispatch")) | sort_by(.createdAt) | reverse | if length > 0 then [.[0].createdAt, (.[0].event // ""), (.[0].status // ""), (.[0].conclusion // ""), (.[0].url // "")] | @tsv else "" end')"
          latest_created=""
          latest_event=""
          latest_status=""
          latest_conclusion=""
          latest_url=""
          if [ -n "$latest_run" ]; then
            IFS=$'\t' read -r latest_created latest_event latest_status latest_conclusion latest_url <<< "$latest_run"
          fi

          if [ -n "$latest_created" ]; then
            latest_epoch="$(date -u -d "$latest_created" +%s)"
            if [ "$latest_epoch" -ge "$threshold_epoch" ]; then
              echo "Latest audit fired by $latest_event at $latest_created ($latest_status/$latest_conclusion): $latest_url"
              issue_number="$(TITLE="$title" gh api \
                --method GET "repos/$REPO/issues" \
                -f state=open \
                -f labels="$tracking_label" \
                -f creator='github-actions[bot]' \
                --jq 'map(select(.title == env.TITLE and (.pull_request | not))) | .[0].number // ""')"
              if [ -n "$issue_number" ]; then
                gh issue comment "$issue_number" --repo "$REPO" \
                  --body "Full-lockfile audit heartbeat recovered: $latest_url"
                gh api --method PATCH "repos/$REPO/issues/$issue_number" \
                  -f state=closed \
                  -f state_reason=completed \
                  >/dev/null
              fi
              exit 0
            fi
          fi

          gh label create "$tracking_label" \
            --repo "$REPO" \
            --description "Workflow-owned full-lockfile audit heartbeat tracking" \
            --color D93F0B \
            2>/dev/null || true
          issue_number="$(TITLE="$title" gh api \
            --method GET "repos/$REPO/issues" \
            -f state=open \
            -f labels="$tracking_label" \
            -f creator='github-actions[bot]' \
            --jq 'map(select(.title == env.TITLE and (.pull_request | not))) | .[0].number // ""')"
          body="$(mktemp)"
          {
            echo "<!-- full-lockfile-audit-heartbeat -->"
            echo "No scheduled or manual full-lockfile audit run has been observed in the last 10 days."
            echo ""
            echo "Heartbeat run: $RUN_URL"
            if [ -n "$latest_created" ]; then
              echo ""
              echo "Latest audit run: $latest_created ($latest_event/$latest_status/$latest_conclusion): $latest_url"
            fi
          } > "$body"
          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --repo "$REPO" --body-file "$body"
          else
            gh issue create --title "$title" --repo "$REPO" --label "$tracking_label" --body-file "$body"
          fi
          exit 1
