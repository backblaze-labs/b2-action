name: Full lockfile audit heartbeat

on:
  schedule:
    # Daily, 05:41 UTC (off-the-hour to avoid the GH Actions cron stampede).
    - cron: '41 5 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  heartbeat:
    name: verify recent full-lockfile audit
    if: github.repository == 'backblaze-labs/b2-action'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # inspect scheduled full-lockfile audit runs
      issues: write # open or update the heartbeat tracking issue
    steps:
      - name: Check latest scheduled audit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          threshold_epoch="$(date -u -d '8 days ago' +%s)"
          latest_run="$(gh run list \
            --repo "$REPO" \
            --workflow full-lockfile-audit.yml \
            --event schedule \
            --branch main \
            --limit 1 \
            --json createdAt,status,conclusion,url \
            --jq 'if length > 0 then [.[0].createdAt, (.[0].status // ""), (.[0].conclusion // ""), (.[0].url // "")] | @tsv else "" end')"
          latest_created=""
          latest_status=""
          latest_conclusion=""
          latest_url=""
          if [ -n "$latest_run" ]; then
            IFS=$'\t' read -r latest_created latest_status latest_conclusion latest_url <<< "$latest_run"
          fi

          if [ -n "$latest_created" ]; then
            latest_epoch="$(date -u -d "$latest_created" +%s)"
            if [ "$latest_epoch" -ge "$threshold_epoch" ]; then
              echo "Latest scheduled audit fired at $latest_created ($latest_status/$latest_conclusion): $latest_url"
              exit 0
            fi
          fi

          title="Full-lockfile audit heartbeat missing"
          issue_number="$(gh issue list \
            --repo "$REPO" \
            --state open \
            --search "$title in:title" \
            --json number \
            --jq '.[0].number // ""')"
          body="$(mktemp)"
          {
            echo "No scheduled full-lockfile audit run has been observed in the last 8 days."
            echo ""
            echo "Heartbeat run: $RUN_URL"
            if [ -n "$latest_created" ]; then
              echo ""
              echo "Latest scheduled audit run: $latest_created ($latest_status/$latest_conclusion): $latest_url"
            fi
          } > "$body"
          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --repo "$REPO" --body-file "$body"
          else
            gh issue create --title "$title" --repo "$REPO" --body-file "$body"
          fi
          exit 1
