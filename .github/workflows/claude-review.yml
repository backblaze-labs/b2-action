name: Claude review

# AI review on every ready PR, as two separate passes: the REVIEW.md passes and a security pass.
# Findings are inline comments tagged Important / Nit / Pre-existing; the action never approves,
# and approval stays a human code owner's. Inactive until an admin adds the ANTHROPIC_API_KEY
# repository secret: without it each job logs a notice and skips its review step.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read # check out the repository to read the diff and the surrounding code

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: claude review (REVIEW.md)
    # Skip Dependabot, drafts, and fork PRs (forks get no secrets).
    if: ${{ github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' && !github.event.pull_request.draft && github.event.pull_request.head.repo.fork == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # read the code under review
      pull-requests: write # post review comments; the action never approves
    steps:
      # claude-code-action fails unless the triggering actor is a human (a `User` account), so a
      # push by another bot or app (github-actions[bot], Copilot) skips cleanly instead of failing.
      - name: Decide whether to review
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Claude review skipped::Add the ANTHROPIC_API_KEY repository secret to enable AI review (see REVIEW.md)."
          elif [ "$(gh api "users/$ACTOR" --jq .type 2>/dev/null)" != "User" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Claude review skipped::Triggered by a non-human actor; the review action only runs for human-triggered events."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        if: steps.key.outputs.present == 'true'
        with:
          persist-credentials: false
          fetch-depth: 0 # the review reads the diff against the base branch
      # `gh pr view` shows conversation comments, not inline review threads, so save every
      # thread (replies, resolution, the commit it was raised on) and every review for the prompt.
      - name: Fetch prior review context
        if: steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          # GraphQL variables, not shell ones; kept in env so the shell never sees them.
          QUERY: >-
            query($owner:String!,$name:String!,$n:Int!,$endCursor:String){repository(owner:$owner,name:$name){pullRequest(number:$n){reviewThreads(first:100,after:$endCursor){pageInfo{hasNextPage endCursor}
            nodes{isResolved isOutdated path line originalLine comments(first:100){nodes{author{login} body createdAt originalCommit{oid}}}}}}}}
        run: |
          set -euo pipefail
          mkdir -p .review-context
          gh api graphql --paginate -F owner="${REPO%/*}" -F name="${REPO#*/}" -F n="$PR" -f query="$QUERY" \
            | jq -s '{threads: [.[].data.repository.pullRequest.reviewThreads.nodes[]]}' > .review-context/review-threads.json
          gh api --paginate "repos/$REPO/pulls/$PR/reviews" \
            | jq -s '[add[] | {author: .user.login, state, commit: .commit_id, submitted_at, body}]' > .review-context/reviews.json
          echo "review context: $(jq '.threads | length' .review-context/review-threads.json) threads, $(jq length .review-context/reviews.json) reviews"
      - uses: anthropics/claude-code-action@a26b07d8c778b0c43f64618e5fd29fd0f8af72e8 # v1.0.250
        if: steps.key.outputs.present == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Follow REVIEW.md exactly: its passes, severity tags, `path:line` evidence, nit cap,
            do-not-report list, and convergence rules. Read AGENTS.md and the review lessons in
            docs/design-docs/review-lessons.md for the areas this diff touches. If the PR links a
            plan under docs/exec-plans/active/, check the change against it.
            Before reviewing, read .review-context/review-threads.json (every earlier inline
            thread with its replies, resolution state, and the commit it was raised on) and
            .review-context/reviews.json (every review and the commit it covered). Do not re-raise
            a finding that is resolved or answered unless this diff reintroduces it; if a reply
            says a finding was wrong or intentional, accept that unless you have new evidence.
            Post each finding as an inline comment on the line it concerns. Finish with one
            summary comment that starts with the counts
            (Important, Nit, Pre-existing) and says plainly when there is nothing to fix.
            Do not approve, request changes, push commits, or edit files.
          claude_args: >-
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"

  security:
    name: claude security review
    if: ${{ github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' && !github.event.pull_request.draft && github.event.pull_request.head.repo.fork == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # read the code under review
      pull-requests: write # post review comments; the action never approves
    steps:
      - name: Decide whether to review
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Claude security review skipped::Add the ANTHROPIC_API_KEY repository secret to enable the security pass (see REVIEW.md)."
          elif [ "$(gh api "users/$ACTOR" --jq .type 2>/dev/null)" != "User" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Claude security review skipped::Triggered by a non-human actor; the review action only runs for human-triggered events."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        if: steps.key.outputs.present == 'true'
        with:
          persist-credentials: false
          fetch-depth: 0 # the review reads the diff against the base branch
      # `gh pr view` shows conversation comments, not inline review threads, so save every
      # thread (replies, resolution, the commit it was raised on) and every review for the prompt.
      - name: Fetch prior review context
        if: steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          # GraphQL variables, not shell ones; kept in env so the shell never sees them.
          QUERY: >-
            query($owner:String!,$name:String!,$n:Int!,$endCursor:String){repository(owner:$owner,name:$name){pullRequest(number:$n){reviewThreads(first:100,after:$endCursor){pageInfo{hasNextPage endCursor}
            nodes{isResolved isOutdated path line originalLine comments(first:100){nodes{author{login} body createdAt originalCommit{oid}}}}}}}}
        run: |
          set -euo pipefail
          mkdir -p .review-context
          gh api graphql --paginate -F owner="${REPO%/*}" -F name="${REPO#*/}" -F n="$PR" -f query="$QUERY" \
            | jq -s '{threads: [.[].data.repository.pullRequest.reviewThreads.nodes[]]}' > .review-context/review-threads.json
          gh api --paginate "repos/$REPO/pulls/$PR/reviews" \
            | jq -s '[add[] | {author: .user.login, state, commit: .commit_id, submitted_at, body}]' > .review-context/reviews.json
          echo "review context: $(jq '.threads | length' .review-context/review-threads.json) threads, $(jq length .review-context/reviews.json) reviews"
      - uses: anthropics/claude-code-action@a26b07d8c778b0c43f64618e5fd29fd0f8af72e8 # v1.0.250
        if: steps.key.outputs.present == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            Run a security review of pull request #${{ github.event.pull_request.number }} in
            ${{ github.repository }}, separate from the general review. Use the Security pass in
            REVIEW.md and section 5 (secrets and log safety) and section 6 (workflows) of
            docs/design-docs/review-lessons.md. Look for: secrets or credentials reaching outputs,
            logs, annotations, or summary-json; user input echoed into workflow commands; raw HTTP
            or subprocesses replacing the SDK; workflow permission, trigger, cache, and pinning
            mistakes; and unverified downloads. First read .review-context/review-threads.json and
            .review-context/reviews.json, and do not re-raise a resolved or answered finding unless
            this diff reintroduces it. Report only issues you can tie to a `path:line`
            in this diff, tagged Important or Pre-existing, as inline comments, then one summary
            comment that starts with the count and says plainly when there is nothing to fix.
            Do not approve, request changes, push commits, or edit files.
          claude_args: >-
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
