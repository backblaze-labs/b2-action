name: CodeQL

# Static analysis (SAST) over the TypeScript source with GitHub CodeQL.
# Runs on PRs to main, on push to main, and weekly so newly-added queries catch
# issues in code that hasn't changed. Findings surface in the repo Security tab.
#
# `build-mode: none`: JavaScript/TypeScript is analyzed straight from source, so
# no compile or dependency install is needed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Monday 04:23 UTC (off-the-hour to avoid the cron stampede).
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    if: github.event_name == 'schedule' || github.event_name == 'push' || (github.event.pull_request.head.repo.fork == false && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload results to the Security tab
      actions: read # read workflow run metadata required for CodeQL on private repos
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: '/language:javascript-typescript'
