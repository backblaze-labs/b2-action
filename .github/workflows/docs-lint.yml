name: Docs lint

# Four integrity checks for the documentation + prose surface:
#   1. `action.yml` <> README.md sync (every input/output appears in both).
#   2. markdownlint-cli2 for prose style consistency.
#   3. lychee for broken markdown links (offline + fragment-aware).
#   4. cspell for spelling across source, markdown, and workflow YAML.
#
# Reproducible docs checks. Runs on every PR + every push to main.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '**/*.md'
      - '**/*.ts'
      - '**/*.yml'
      - '**/*.yaml'
      - 'action.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'cspell.json'
      - '.cspell/**'
      - 'scripts/check-action-yml-vs-readme.mjs'
      - 'scripts/run-lychee-lib.mjs'
      - 'scripts/run-lychee.mjs'
      - '.markdownlint-cli2.jsonc'
      - '.github/workflows/docs-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-check:
    name: action.yml <> README
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node scripts/check-action-yml-vs-readme.mjs

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      # Keep CI on the lockfile-pinned tool version while avoiding lifecycle
      # scripts from package.json in pull_request runs. The exec command below
      # intentionally mirrors the docs:lint script without invoking scripts.
      - run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile --ignore-scripts; then
              exit 0
            fi
            echo "pnpm install failed on attempt ${attempt}; retrying..." >&2
            sleep $((attempt * 5))
          done
          echo "pnpm install failed after 3 attempts." >&2
          exit 1
      - run: pnpm exec markdownlint-cli2

  link-check:
    name: Markdown link check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: lychee-cache
        with:
          path: ${{ runner.temp }}/lychee-cache
          key: ${{ runner.os }}-${{ runner.arch }}-lychee-0.23.0
      # Same dependency-free pinned-lychee runner as docs:links, called
      # directly so this pull_request job does not depend on package scripts.
      # The offline, fragment-aware, node_modules-excluding flags live there.
      - run: node scripts/run-lychee.mjs
        env:
          LYCHEE_CACHE_DIR: ${{ runner.temp }}/lychee-cache
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.lychee-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/lychee-cache
          key: ${{ steps.lychee-cache.outputs.cache-primary-key }}

  spellcheck:
    name: cspell
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      # Same lockfile-pinned, no-lifecycle pattern as markdownlint. Keep the
      # exec arguments in sync with the spellcheck script without invoking it.
      - run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile --ignore-scripts; then
              exit 0
            fi
            echo "pnpm install failed on attempt ${attempt}; retrying..." >&2
            sleep $((attempt * 5))
          done
          echo "pnpm install failed after 3 attempts." >&2
          exit 1
      - run: pnpm exec cspell --no-progress --no-must-find-files
