name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read # needed to check out and test the repository

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  coverage:
    name: coverage (>= 95% statements)
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore

  lint:
    name: lint
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  audit:
    name: dependency audit
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Fail on high/critical advisories in PRODUCTION dependencies only, so a
      # devDep advisory can't block an unrelated PR. The action ships only its
      # runtime deps (plus the bundled dist/), so prod scope is what users get.
      # Invoke the builtin `pnpm audit` directly so this job audits against the
      # committed pnpm-lock.yaml with no `pnpm install` step and no script-runner
      # indirection; it does not need node_modules on disk.
      - run: pnpm audit --prod --audit-level high

  build-and-check-dist:
    name: build + dist freshness
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    env:
      # Bundle-size ceiling. Bump deliberately if we add genuinely needed deps;
      # never bump just to make CI green.
      MAX_BUNDLE_BYTES: '4194304' # 4 MiB
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify dist/ matches src/
        run: |
          if ! git diff --exit-code -- dist/; then
            echo "::error::dist/ is out of sync with src/. Run 'pnpm build' locally and commit the result."
            exit 1
          fi
      - name: Bundle size budget
        run: |
          SIZE=$(wc -c < dist/index.js)
          echo "dist/index.js is $SIZE bytes (budget: $MAX_BUNDLE_BYTES)"
          {
            echo "### Bundle size"
            echo ""
            echo "\`dist/index.js\` = **$SIZE bytes** (budget: **$MAX_BUNDLE_BYTES**)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$SIZE" -gt "$MAX_BUNDLE_BYTES" ]; then
            echo "::error::dist/index.js exceeds budget. Either trim the dependency footprint or raise MAX_BUNDLE_BYTES in ci.yml with justification."
            exit 1
          fi

  self-smoke:
    name: action smoke test (offline)
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    needs: build-and-check-dist
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Invoke the bundle with missing action input
        run: |
          set +e
          OUTPUT=$(node dist/index.js 2>&1)
          set -e
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "Input required and not supplied: action" || {
            echo "::error::Expected an error about missing 'action' input"
            exit 1
          }
