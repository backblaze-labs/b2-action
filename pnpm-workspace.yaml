allowBuilds:
  '@biomejs/biome': true
  esbuild: true

# Trust our own first-party SDK immediately (published from a sibling repo);
# exempt @backblaze-labs/* from the supply-chain minimum-release-age gate so a
# freshly published version does not block `pnpm install --frozen-lockfile`.
minimumReleaseAgeExclude:
  - '@backblaze-labs/*'

# Keep lockfile/install resolution on patched dev/build tooling versions while
# still allowing future compatible security patches.
overrides:
  # markdownlint-cli2 pulls js-yaml; keep it above the <=4.1.1 parser DoS range.
  # Drop when markdownlint-cli2 resolves js-yaml >=4.2.0 without an override.
  js-yaml: ^4.2.0
  # markdownlint-cli2 and TypeDoc pull markdown-it; keep it above the <=14.1.1
  # parser DoS range. Drop when both trees resolve markdown-it >=14.2.0 directly.
  markdown-it: ^14.2.0
  # Vitest can resolve Vite below 7.3.5; keep the build/test toolchain on the
  # patched minor. Drop when Vitest's Vite floor is >=7.3.5.
  vite: ^7.3.5
