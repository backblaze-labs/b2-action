allowBuilds:
  '@biomejs/biome': true
  esbuild: true

# Trust our own first-party SDK immediately (published from a sibling repo);
# exempt @backblaze-labs/* from the supply-chain minimum-release-age gate so a
# freshly published version does not block `pnpm install --frozen-lockfile`.
minimumReleaseAgeExclude:
  - '@backblaze-labs/*'

# Keep dependency audits from resolving vulnerable dev/build tooling versions
# while still allowing future compatible security patches.
overrides:
  js-yaml: ^4.2.0
  markdown-it: ^14.2.0
  vite: ^7.3.5
